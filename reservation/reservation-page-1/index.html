<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservation Page 1</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <style></style>
  <body>
    <nav class="top-page">
      <div class="language-selection">
        <!--top right to choose language-->
        <select class="language-style">
          <option>EN</option>
          <option>VIE</option>
        </select>
      </div>
    </nav>
    <div class="phase">
      <ul>
        <li>
          <img
            src="../../images/reservation/reservation-page-1/number_1.png"
            alt="step 1"
            style="height: 20px"
          />DESTINATION
        </li>
        <li></li>
        <li class="upcoming__phase">
          <img
            src="../../images/reservation/reservation-page-2/number_2.png"
            alt="step 2"
            style="height: 20px"
          />ROOMS
        </li>
        <li></li>
        <li class="upcoming__phase">
          <img
            src="../../images/reservation/reservation-page-2/number_3.png"
            alt="step 3"
            style="height: 20px"
          />SPECIAL REQUEST
        </li>
        <li></li>
        <li class="upcoming__phase">
          <img
            src="../../images/reservation/reservation-page-2/number_4.png"
            alt="step 4"
            style="height: 20px"
          />CONFIRM
        </li>
      </ul>
    </div>
    <nav class="page__detail">
      <div class="step__detail">
        <div class="hotel">
          <p>Hotel</p>
          <button>
            <div class="button__info">
            <p>Vietnam</p>
            <p>Diamond Land Hotel</p>
            </div>
            <img
              src="../../images/reservation/reservation-page-1/bigger.png"
              alt="pointer"
            />
          </button>
        </div>
        <div class="room">
          <p>Room & guests</p>
        </div>
        <div class="dates">
          <p>Dates</p>
        </div>
      </div>
      <div class="info__detail">temp</div>
    </nav>
  </body>
</html>
