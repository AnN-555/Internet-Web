<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservation Page 4</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="top-page">
      <div class="language-selection">
        <!--top right to choose language-->
        <select class="language-style">
          <option>EN</option>
          <option>VIE</option>
        </select>
      </div>
    </nav>
    <!--track your phase-->
    <div class="phase">
      <ul>
        <li>DESTINATION</li>
        <li>
          <img
            src="../images/reservation-page-2/number_2.png"
            alt="step 2"
            style="height: 20px"
          />ROOMS
        </li>
        <li>
          <img
            src="../images/reservation-page-2/number_3.png"
            alt="step 3"
            style="height: 20px"
          />SPECIAL REQUEST
        </li>
        <li>
          <img
            src="../images/reservation-page-2/number_4.png"
            alt="step 4"
            style="height: 20px"
          />CONFIRM
        </li>
      </ul>
    </div>
    <div class="content">
        <h1>Confirm your reservation</h1>
    </div>

    <section class="reservation-form">
        <h2>Your details</h2>
        <p>All fields are required</p>

        <div class="form-group title-group">
            <label>Title</label>
            <div class="radio-group">
            <label><input type="radio" name="title"> Mr</label>
            <label><input type="radio" name="title"> Ms</label>
            <label><input type="radio" name="title"> Mrs</label>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
            <label>First name</label>
            <input type="text">
            </div>
            <div class="form-group">
            <label>Last name</label>
            <input type="text">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
            <label>Code</label>
            <select>
                <option>VN +84</option>
                <option>US +1</option>
                <option>JP +81</option>
            </select>
            </div>
            <div class="form-group">
            <label>Phone number</label>
            <input type="text">
            </div>
            <div class="form-group">
            <label>Email address</label>
            <input type="email">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
            <label>City</label>
            <input type="text">
            </div>
            <div class="form-group">
            <label>Country</label>
            <select>
                <option>Vietnam</option>
                <option>Japan</option>
                <option>USA</option>
            </select>
            </div>
        </div>

        <div class="form-checkbox">
            <label><input type="checkbox"> * I will present a valid ID during check in</label>
        </div>

        <div class="form-checkbox">
            <label>
            <input type="checkbox"> * I have read and agree to 
            <a href="#">Terms & Conditions</a>.
            <br>For details of how we process your personal data please refer to our 
            <a href="#">Privacy Policy</a>.
            </label>
        </div>

        <button class="submit-btn">CONTINUE TO RESERVE</button>
    </section>

    </body>
